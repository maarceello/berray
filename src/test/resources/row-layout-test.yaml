type: frame
size: [  400, 550  ]
layoutManager:
  type: row-layout
  columns: "50px;5em;2*;3*"
  height: "1.5em"
border: bevel
title: Info Model
children:
  - type: checkbox
    model:
      type: checkbox-button-model
      value: "play"
  - type: label
    label: "BAR"
  - type: slider
    model:
      type: property-slider-model
      min: 0
      max: 100
      value: "value"
  - type: sprite
    texture: "berry"
